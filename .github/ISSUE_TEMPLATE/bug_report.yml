name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: Do not include secrets, signing links, personal data, or real documents. Report security vulnerabilities through private advisories.
  - type: input
    id: version
    attributes:
      label: Version and deployment environment
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal example with synthetic data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
