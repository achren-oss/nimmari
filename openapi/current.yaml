  /api/sign/{token}/pdf:
    get:
      operationId: getApiSignTokenPdf
      summary: Download signed copy
      description: Requires this slot to have signed; expiry still applies. Signed
        slots retain read-only access after cancellation/decline. Private values remain
        masked on stopped incomplete PDFs; completed PDFs expose all values.
      responses:
        '200':
          description: Success
          headers:
            Content-Length:
              description: Length in bytes of the served PDF.
              schema:
                type: integer
                minimum: 0
            X-Content-SHA256:
              description: Hex SHA-256 of the served PDF bytes.
              schema:
                type: string
                pattern: '^[0-9a-f]{64}$'
            Repr-Digest:
              description: 'SHA-256 of the served bytes, formatted as sha-256=:<base64>:'
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lifecycle or signing-order conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
