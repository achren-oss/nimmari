        '503':
          description: Incomplete PDF withheld; retry after the indicated delay.
          headers:
            Retry-After:
              description: Retry delay in seconds.
              schema:
                type: integer
                enum: [2]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: PDF not ready
      parameters:
      - name: token
        in: path
        required: true
        schema: *id001
      security: []
  /api/documents/{id}/signers/{slotKeyOrSessionId}/reissue:
    post:
      summary: Rotate one existing unsigned active slot link
      description: Atomically invalidates old token, resets expiry to 30 days (including expired slots).
        Signed, stopped, completed or sequentially waiting slots return 409. Does not create a slot.
        Existing plaintext tokens remain for sequential-invite compatibility; rotation is preferred
        over recovery.
      parameters:
        - name: id
          in: path
          required: true
          schema: &a1
            type: string
        - name: slotKeyOrSessionId
          in: path
          required: true
          schema: *a1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notify: &a2
                  type: boolean
                  description: Defaults to original slot invitation preference, gated by document notify. False
                    disables email.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReissueResult"
        "400":
          description: Invalid body, status, limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Lifecycle, signing order or active lease conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/documents/{id}/resend:
    post:
      summary: Rotate links and re-deliver existing active unsigned slots
      description: Creates no slots. Omitted signers selects active unsigned slots; waiting sequential
        slots are skipped. Explicitly selected waiting/signed slots return 409. notify:false returns
        fresh links without email.
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signers:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
                notify: *a2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - signers
                properties:
                  signers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReissueResult"
        "400":
          description: Invalid body, status, limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Lifecycle, signing order or active lease conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/documents/{id}/webhooks:
    get:
      summary: Read owner document delivery history
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
        - &a3
          name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - &a4
          name: cursor
          in: query
          required: false
          schema:
            type: string
            description: Opaque nextCursor returned by prior page; stable createdAt desc, id desc ordering.
        - &a5
          name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - delivered
              - failed
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: &a6
                type: object
                required:
                  - deliveries
                  - nextCursor
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
                  nextCursor:
                    type:
                      - string
                      - "null"
        "400":
          description: Invalid body, status, limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Lifecycle, signing order or active lease conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/webhooks/deliveries:
    get:
      summary: Read only the key owner's delivery history (including admin keys)
      security:
        - ownerBearer: []
      parameters:
        - *a3
        - *a4
        - *a5
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: *a6
        "400":
          description: Invalid body, status, limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: API key required
