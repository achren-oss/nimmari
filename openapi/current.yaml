          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/webhooks/deliveries/process:
    post:
      summary: Claim and process at most three due deliveries
      description: Regular key processes only its owner. Admin/root processes all owners. Suitable for
        external cron every minute. DB leases coordinate workers across instances.
      security:
        - ownerBearer: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResult"
        "400":
          description: Invalid body, status, limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: API key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Lifecycle, signing order or active lease conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/webhooks/deliveries/{id}/redeliver:
    post:
      summary: Reset owner delivery retry budget and attempt immediately
      description: Requires owner even for admin keys. Active leases return 409. Resets attemptCount to
        zero, including delivered/failed items. Receivers must deduplicate by delivery ID.
      security:
        - ownerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResult"
        "400":
          description: Invalid body, status, limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: API key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Lifecycle, signing order or active lease conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    ownerBearer:
      description: Server root NIMMARI_API_KEY or active owner-scoped database key.
        Root document requests require NIMMARI_API_OWNER_ID. Invalid bearer
        credentials never fall back to session cookies.
      type: http
      scheme: bearer
    ownerSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session; secure deployments may use the __Secure- cookie
        prefix.
    signingToken:
      type: apiKey
      in: query
      name: t
      description: Unexpired signing token associated with this document.
  schemas:
    ReissueResult:
      type: object
      required:
        - url
        - signingSessionId
        - expiresAt
        - emailSent
      properties:
        key:
          type:
            - string
            - "null"
        url:
          type: string
          format: uri
          description: Secret capability URL. Share only with intended signer.
        signingSessionId: &a1
          type: string
        expiresAt:
          type: string
          format: date-time
        emailSent:
          type: boolean
        emailNote: *a1
    ProcessResult:
      type: object
      required:
        - processed
      properties:
        processed:
          type: integer
          minimum: 0
          maximum: 3
    DocumentSummary:
      type: object
      required:
        - id
        - title
        - status
        - kind
        - createdAt
        - updatedAt
        - signers
      properties:
        id: *a1
        title: *a1
        status:
          type: string
          enum:
            - draft
            - sent
            - completed
            - cancelled
            - declined
        kind:
          type: string
          enum:
            - pdf
            - html
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        signers:
          type: array
          items:
            type: object
            required:
              - key
              - name
              - email
              - status
              - signedAt
            properties:
              key:
                type:
                  - string
                  - "null"
              name:
                type:
                  - string
                  - "null"
              email:
                type: string
                format: email
              status:
                type: string
                enum:
                  - pending
                  - signed
                  - declined
                  - expired
              signedAt: &a2
                type:
                  - string
                  - "null"
                format: date-time
    WebhookDelivery:
      type: object
      required:
        - id
        - documentId
        - eventType
        - url
        - attemptCount
        - status
        - nextAttemptAt
        - createdAt
        - updatedAt
      properties:
        id: *a1
        documentId: *a1
        eventType:
          type: string
          enum:
            - document.completed
            - document.cancelled
            - document.declined
        url:
          type: string
          format: uri
        attemptCount:
          type: integer
          minimum: 0
          description: Attempts in current retry budget; manual redeliver resets this.
        status:
          type: string
          enum:
            - pending
            - delivered
            - failed
        nextAttemptAt: *a2
        lastStatusCode:
          type:
            - integer
            - "null"
        lastError:
          type:
            - string
            - "null"
          maxLength: 500
        createdAt: *a2
        updatedAt: *a2
    ApiKey:
      type: object
      required:
        - id
        - name
        - scope
        - ownerUserId
        - prefix
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum:
            - admin
            - regular
        ownerUserId:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
    Error:
      type: object
      properties:
        error: *id001
        status: *id001
      required:
      - error
    Signer:
      type: object
      properties:
        email:
          type: string
          format: email
        name: *id001
        key:
          type: string
          minLength: 1
          maxLength: 200
        order:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - email
    Send:
      type: object
      properties:
        email:
          type: string
          format: email
        name: *id001
        senderName:
          type: string
          minLength: 1
          maxLength: 80
        signers:
          type: array
          items:
            $ref: '#/components/schemas/Signer'
        notify:
          type: boolean
          default: true
          description: Invitations and follow-ups only; upload notify=false suppresses
            all document emails.
    Link:
      type: object
      properties:
        key: *id001
        url:
          type: string
          format: uri
          description: Secret signing capability; deliver only to this signer slot.
        signingSessionId: *id001
        emailSent: *id005
        emailNote: *id001
      required:
      - key
      - url
      - signingSessionId
      - emailSent
    SendResult:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/Link'
        - type: object
          properties:
            expiresAt:
              type: string
              format: date-time
          required:
          - expiresAt
      - type: object
        properties:
          signers:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/Link'
              - type: object
                properties:
                  email: *id001
                  name: &id007
                    type:
                    - string
                    - 'null'
                  order:
                    type:
                    - integer
                    - 'null'
          expiresAt:
            type: string
            format: date-time
        required:
        - signers
        - expiresAt
    FieldInput:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          description: Existing field ID belonging to this document.
        value:
          type: [string, "null"]
        prefilled:
          type: boolean
        type:
          type: string
          enum:
          - text
          - textarea
          - checkbox
          - signature
          - date
          - hetu
        page:
          type: integer
          minimum: 0
        x: *id006
        y: *id006
        width:
          type: integer
          minimum: 10
        height:
          type: integer
          minimum: 10
        name:
          type: string
          minLength: 1
          maxLength: 200
        label: *id001
        required:
          type: boolean
          description: Defaults to true for signatures and false for other types on insert.
            Visible signatures always require signing regardless of this flag.
            HTML non-signature fields opt in via data-pm-required; existing stored flags are unchanged.
        privateForOtherSigners:
          type: boolean
          default: false
        assignedSignerKey:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
        assignedToSignerEmail:
          type:
          - string
          - 'null'
          format: email
      required:
      - type
      - page
      - x
      - y
      - width
      - height
    Field:
      type: object
      properties:
        id: *id001
        name: *id007
        type: *id001
        label: *id007
        required: *id005
        prefilled: *id005
        value: *id007
        privateForOtherSigners: *id005
        assignedSignerKey: *id007
        assignedToSignerEmail: *id007
        page:
          type:
          - integer
          - 'null'
        x:
          type:
          - integer
          - 'null'
        y:
          type:
          - integer
          - 'null'
        width:
          type:
          - integer
          - 'null'
        height:
          type:
          - integer
          - 'null'
    Session:
      type: object
      properties:
        signerKey: *id007
        recipientEmail: *id001
        recipientName: *id007
        signedAt:
          type:
          - string
          - 'null'
          format: date-time
        declinedAt:
          type:
          - string
          - 'null'
          format: date-time
        linkClickedAt:
          type:
          - string
          - 'null'
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        declineReason: *id007
    Document:
      type: object
      properties:
        id: *id001
        title: *id001
        kind:
          type: string
          enum:
          - pdf
          - html
        status:
          type: string
          enum:
          - draft
          - sent
          - completed
          - cancelled
          - declined
        cancelledAt: *id007
        cancelReason: *id007
        declinedAt: *id007
        declineReason: *id007
        createdAt: *id001
        updatedAt: *id001
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        signingSessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    Prefill:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            type: string
            maxLength: 5000
          description: PDF field IDs or HTML field names. Signatures cannot be prefilled.
        clear: *id005
        mode:
          type: string
          enum:
          - merge
          - replace
          default: merge
      required:
      - values
    Reason:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
    Sign:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            type: string
            maxLength: 5000
        signaturePng:
          type:
          - string
          - 'null'
          description: PNG data URL; required for signature fields. Never submit for
            a real signer.
      required:
      - values
      - signaturePng
    SignerView:
      type: object
      properties:
        documentId: *id001
        kind: *id001
        title: *id001
        recipientEmail: *id001
        recipientName: *id007
        signerKey: *id007
        signedAt: *id007
        fields:
          type: array
          items:
            type: object
            description: Permitted fields only, with prefilled/readOnly flags; keys
              and shape depend on PDF or HTML.
x-webhook-events:
  events:
  - document.completed
  - document.cancelled
  - document.declined
  description: Transactional DB outbox POST to upload webhookUrl. Immediate attempt, then
    1m/5m/30m/2h/12h backoff with up to 20 percent jitter; six attempts total.
    Non-2xx and timeouts retry; redirects refused. Ten-second timeout and DB leases.
    Optional X-Puumerkki-Signature is unchanged lowercase hex HMAC-SHA256 of exact
    raw body bytes with NIMMARI_WEBHOOK_SECRET. X-Nimmari-Delivery-Id is stable across
    attempts; X-Nimmari-Attempt is one-based. Receivers must deduplicate delivery IDs.
    Owner history and manual redelivery are available; polling owner GET remains the fallback.
    Authenticated requests and health process bounded batches; optional standalone
    interval worker and authenticated external cron also trigger processing.
