openapi: 3.1.0
info:
  title: Nimmari implemented API
  version: 1.4.0
  description: Implemented unversioned routes. Owner-scoped database bearer keys or Better Auth
    sessions for documents. Account/key management requires bearer keys; root/admin can
    provision accounts. Public signup is disabled. Root NIMMARI_API_KEY can bootstrap
    without NIMMARI_API_OWNER_ID, but root document requests require that owner.
    Admin database keys access only their owner's documents; signer tokens are secret capabilities. SES drawn signatures only. Proposed
    /v1 routes are documented separately in v1.yaml.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
- url: http://localhost:3000
  description: Replace with your self-hosted instance origin.
security:
- ownerBearer: []
- ownerSession: []
paths:
  /api/setup/claim:
    get:
      security: []
      summary: Inspect one-time setup availability
      responses:
        '200':
          description: Only enabled and claimed booleans; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [enabled, claimed]
                properties:
                  enabled: {type: boolean}
                  claimed: {type: boolean}
    post:
      security: []
      summary: Claim the first account and admin and regular API keys once
      description: >-
        Requires a configured 32+ character NIMMARI_SETUP_CODE (legacy PUUMERKKI_SETUP_CODE).
        Constant-time secret comparison. Ten attempts per IP per ten-minute fixed window.
        All writes are atomic. All responses have Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupCode, email, name]
              properties:
                setupCode: {type: string}
                email: {type: string, format: email}
                name: {type: string}
                password: {type: string, minLength: 8, maxLength: 128}
      responses:
        '201':
          description: Account, generated password only when omitted, adminKey and agentKey with id/key/scope, and baseUrl. Plaintext keys returned once.
          content:
            application/json:
              schema:
                type: object
                required: [account, adminKey, agentKey, baseUrl]
                properties:
                  account:
                    type: object
                    required: [id, email, name]
                    properties:
                      id: {type: string}
                      email: {type: string}
                      name: {type: string}
                  password: {type: string}
                  adminKey:
                    type: object
                    properties:
                      id: {type: string}
                      key: {type: string}
                      scope: {const: admin}
                  agentKey:
                    type: object
                    properties:
                      id: {type: string}
                      key: {type: string}
                      scope: {const: regular}
                  baseUrl: {type: string}
        '400': {description: Invalid account input}
        '403': {description: Wrong setup code}
        '404': {description: Setup disabled}
        '409': {description: An account already exists}
        '410': {description: 'Already claimed; error is already_claimed'}
        '429': {description: Too many attempts}
        '500': {description: Setup rolled back; retry permitted}
        '503': {description: Rate limiter unavailable}
  /api/accounts:
    get:
      summary: List accounts (admin/root only)
      description: >-
        Sorted by createdAt ascending. Disabled accounts cannot log in; existing server sessions are
        ignored.
      parameters:
        - name: email
          in: query
          description: Exact email filter, trimmed and lowercased
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - accounts
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - email
                        - name
                        - createdAt
                        - disabled
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        name:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        disabled:
                          type: boolean
        '401':
          description: Missing, malformed, invalid or revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Regular key or session authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - ownerBearer: []
      operationId: getApiAccounts
    post:
      summary: Provision an account (admin/root only)
      description: Email is trimmed and lowercased. Omit password to generate one
        returned only in this response. Password limits follow Better Auth.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                  - name
                properties:
                  id:
                    type: string
                  email:
                    type: string
                    format: email
                  name:
                    type: string
                  password:
                    type: string
                    description: Generated password, present only if omitted from request; returned once.
        '400':
          description: Invalid input or missing root owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or session authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate account email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  minLength: 1
                  maxLength: 5000
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      security:
        - ownerBearer: []
      operationId: postApiAccounts
  /api/accounts/{id}:
    delete:
      summary: Delete an account (admin/root only)
      description: >-
        Never deletes documents. In one transaction, revokes keys, deletes sessions and
        credential/provider accounts, then deletes the user; API keys cascade.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - id
                properties:
                  ok:
                    const: true
                  id:
                    type: string
        '401':
          description: Missing, malformed, invalid or revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Regular key or session authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Configured API owner, caller key owner, or account owns documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - ownerBearer: []
      operationId: deleteApiAccountsId
  /api/keys:
    post:
      summary: Create an API key
      description: Scope defaults to regular and ownerUserId to the caller's owner.
        Ownerless root must supply ownerUserId. Regular callers can create only
        regular keys for their own owner; root/admin can create either scope for
        any existing owner. All database keys access only their owner's documents.
        Store the returned plaintext key securely; it is returned only once.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - scope
                  - ownerUserId
                  - prefix
                  - createdAt
                  - key
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  scope:
                    type: string
                    enum:
                      - admin
                      - regular
                  ownerUserId:
                    type: string
                  prefix:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  key:
                    type: string
                    description: Plaintext secret returned once; store securely.
        '400':
          description: Invalid input or missing root owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or session authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Owner/key missing or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                scope:
                  type: string
                  enum:
                    - admin
                    - regular
                  default: regular
                ownerUserId:
                  type: string
                  minLength: 1
      security:
        - ownerBearer: []
      operationId: postApiKeys
    get:
      summary: List key metadata
      description: >-
        Admin/root sees all keys, optionally filtered by ownerUserId. Regular sees own keys regardless
        of query filter. Includes revoked keys. No hashes or plaintext.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          description: Missing, invalid or revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or session authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: ownerUserId
          in: query
          schema:
            type: string
      security:
        - ownerBearer: []
      operationId: getApiKeys
  /api/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Revoke a key
      description: >-
        Regular callers may revoke only their own keys. Admin/root may revoke any key. Repeated
        revocation is safe.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
                    const: true
        '401':
          description: Missing, invalid or revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or session authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Owner/key missing or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - ownerBearer: []
      operationId: deleteApiKeysKeyId
  /api/keys/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Revoke a key
      description: >-
        Regular callers may revoke only their own keys. Admin/root may revoke any key. Repeated
        revocation is safe.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
                    const: true
        '401':
          description: Missing, invalid or revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or session authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Owner/key missing or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - ownerBearer: []
      operationId: postApiKeysKeyIdRevoke
  /api/documents:
    get:
      summary: List strictly owner-scoped document summaries
      description: Never includes signing tokens or document content. Stable createdAt descending, id
        descending ordering. Comma-separated statuses are supported.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: Opaque nextCursor returned by prior page; stable createdAt desc, id desc ordering.
        - name: status
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated draft,sent,completed,cancelled,declined values.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - documents
                  - nextCursor
                properties:
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentSummary"
                  nextCursor:
                    type:
                      - string
                      - "null"
        "400":
          description: Invalid body, status, limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Lifecycle, signing order or active lease conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: postApiDocuments
      summary: Upload PDF
      description: 4 MiB limit. AcroForm import does not flatten widgets. Inspect
        imported rectangles and assign signer slots before sending.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: &id001
                    type: string
                  importedFields:
                    type:
                    - integer
                    - boolean
                  errors:
                    type: array
                    items: *id001
                  warnings:
                    type: array
                    items: *id001
                  error: *id001
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title: *id001
                notify: &id002
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  default: 'true'
                webhookUrl: &id003
                  type: string
                  format: uri
                  description: HTTPS required for new production destinations. Private/local targets blocked unless NIMMARI_WEBHOOK_ALLOW_PRIVATE=1. Existing public HTTP URLs continue delivery.
                auditTimezone: &id004
                  type: string
                  description: IANA timezone; overrides NIMMARI_AUDIT_TIMEZONE (default
                    Europe/Helsinki).
                pdf:
                  type: string
                  format: binary
                importAcroForm:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
              required:
              - pdf
  /api/documents/html:
    post:
      operationId: postApiDocumentsHtml
      summary: Upload annotated HTML
      description: 2 MiB file limit; raw strings use character count. Sanitized data-pm-field
        controls supply fields and signer assignments.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id001
                  fieldCount: &id006
                    type: integer
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title: *id001
                notify: *id002
                webhookUrl: *id003
                auditTimezone: *id004
                html:
                  type: string
                  description: HTML file part or raw HTML string.
              required:
              - html
  /api/documents/{id}:
    get:
      operationId: getApiDocumentsId
      summary: Read owner document
      description: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/documents/{id}/fields:
    put:
      operationId: putApiDocumentsIdFields
      summary: Edit draft or unsigned sent PDF fields
      description: Existing IDs update in place and preserve omitted metadata and required flags.
        Unknown or duplicate IDs return 400. Omitted fields are deleted; new fields
        receive generated names. Requests without IDs replace all fields. Drafts and
        sent documents without signed sessions may be edited; other states return 409.
        Pending signers see changes on their next load; no emails are sent. Coordinates are integers
        on an 800px-wide page, zero-based page, top-left origin. Key assignment takes
        precedence over email. Completed PDFs expose all private values.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: &id005
                    type: boolean
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lifecycle or signing-order conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items:
                    $ref: '#/components/schemas/FieldInput'
              required:
              - fields
  /api/documents/{id}/prefill:
    put:
      operationId: putApiDocumentsIdPrefill
      summary: Merge or replace draft prefill
      description: Merge by default; clear=true or mode=replace clears omitted fields.
        Signature fields are excluded.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: *id005
                  filled: *id006
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lifecycle or signing-order conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prefill'
  /api/documents/{id}/send:
    post:
      operationId: postApiDocumentsIdSend
      summary: Create signing slots
      description: email supports one signer; nonempty signers takes precedence. Keys
        default to signer-N and must be unique. Duplicate emails with email-only assigned
        fields are rejected; assign by key. Multi-signer signatures must be assigned.
        No additions after signing starts. Orders are zero-based; omitted/null is
        parallel, equal orders form a group. Invitations for later groups are deferred.
        Links expire after 30 days.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lifecycle or signing-order conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Idempotency-Key reused with a different body
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Persist a unique key and exact body. Replay original response/URLs for 24 hours; concurrent requests create one slot set. Different body returns 422. Without header send creates new slots as before.
        schema: {type: string, minLength: 1, maxLength: 255}
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Send'
  /api/documents/{id}/cancel:
    post:
      operationId: postApiDocumentsIdCancel
      summary: Cancel document
      description: Optional or empty body. Draft/sent only. Terminal, emits document.cancelled
        webhook.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: *id005
                  status:
                    const: cancelled
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Owner authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lifecycle or signing-order conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
  /api/sign/{token}/decline:
    post:
      operationId: postApiSignTokenDecline
      summary: Decline document
      description: An unexpired unsigned slot on a sent document may decline. Ends
        signing for everyone, emits document.declined webhook, and emails owner when
        document notify is enabled.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: *id005
                  status:
                    const: declined
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lifecycle or signing-order conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Expired token or stopped document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Signing rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: token
        in: path
        required: true
        schema: *id001
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
  /api/sign/{token}:
    get:
      operationId: getApiSignToken
      summary: Read signer slot
      description: Private fields belonging to other slots are excluded. Stopped documents
        return 410.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignerView'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Expired token or stopped document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: token
        in: path
        required: true
        schema: *id001
      security: []
    post:
      operationId: postApiSignToken
      summary: Submit signer values and signature
      description: Signer action only. PDF values use field IDs; HTML values use names.
        Date values normalize to ISO; hetu has no validation. Required fields and
        sequential order are enforced. Concurrent signing/stop transitions serialize;
        artifacts rebuild from original source.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
