        schema: *id001
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sign'
  /api/documents/{id}/pdf:
    get:
      operationId: getApiDocumentsIdPdf
      summary: Read document PDF
      description: Owner or matching unexpired t token. Private PDF values are excluded
        during signing, exposed to all in completed PDFs. Cancelled/declined unsigned
        tokens are blocked; previously signed slots retain signed PDF access until
        expiry. With signed=1, sent documents return the intermediate PDF; poll
        for completed status before retrieving the final artifact.
      responses:
        '200':
          description: Success
          headers:
            Content-Length:
              description: Length in bytes of the served PDF.
              schema:
                type: integer
                minimum: 0
            X-Content-SHA256:
              description: Hex SHA-256 of the served PDF bytes.
              schema:
                type: string
                pattern: '^[0-9a-f]{64}$'
            Repr-Digest:
              description: 'SHA-256 of the served bytes, formatted as sha-256=:<base64>:'
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Expired token or stopped document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Artifact unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Incomplete PDF withheld; retry after the indicated delay.
          headers:
            Retry-After:
              description: Retry delay in seconds.
              schema:
                type: integer
                enum: [2]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: PDF not ready
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: signed
        in: query
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: t
        in: query
        schema: *id001
      security:
      - ownerBearer: []
      - ownerSession: []
      - signingToken: []
  /api/documents/{id}/html:
    get:
      operationId: getApiDocumentsIdHtml
