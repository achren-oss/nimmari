openapi: "3.1.0"
info:
  title: "Puumerkki Headless API"
  version: "1.0.0-draft"
  description: "Proposed self-hosted headless API v1; not yet implemented. eIDAS SES only. PAdES and RFC 3161 are planned for v1.1. Keys select workspace and live/test mode. All collections use limit/starting_after and data/has_more. Bearer API-key scopes are documented per operation (HTTP bearer security schemes do not express scopes). See docs/api-v1-design.md for lifecycle, evidence and migration decisions."
  license:
    name: "AGPL-3.0-only"
    identifier: "AGPL-3.0-only"
servers:
  -
    url: "{origin}"
    description: "Your self-hosted Puumerkki deployment."
    variables:
      origin:
        default: "https://puumerkki.your-domain.tld"
        description: "Public origin of your deployment (scheme and host, no trailing slash)."
tags:
  -
    name: "Workspace"
    description: "Credential-bound workspace metadata."
  -
    name: "Envelopes"
    description: "Draft preparation and lifecycle actions."
  -
    name: "Documents"
    description: "PDF and HTML source documents."
  -
    name: "Recipients"
    description: "Signer, approver and CC routing."
  -
    name: "Fields"
    description: "Recipient-assigned typed fields and prefill."
  -
    name: "Signing"
    description: "Short-lived embedded signing bootstrap."
  -
    name: "Evidence"
    description: "Immutable final artifacts and hash-chain events."
  -
    name: "Webhooks"
    description: "Outbound event subscriptions and delivery management."
  -
    name: "ApiKeys"
    description: "Scoped revocable workspace credentials."
security:
  -
    bearerApiKey: []
paths:
  "/v1/workspace":
    get:
      operationId: "getWorkspace"
      tags:
        - "Workspace"
      summary: "Read current workspace"
      description: "Required scope: any valid key."
      x-required-scopes: []
      responses:
        200:
          description: "Read current workspace."
          headers:
            X-Request-Id:
              description: "Correlation ID; contains no secrets."
              schema:
                type: "string"
                minLength: 1
                maxLength: 128
            RateLimit-Limit:
              description: "Applicable request quota."
              schema:
                type: "integer"
            RateLimit-Remaining:
              description: "Requests remaining."
              schema:
                type: "integer"
            RateLimit-Reset:
              description: "Seconds until quota resets."
              schema:
                type: "integer"
            Idempotency-Replayed:
              description: "true if a stored mutation response was replayed."
              schema:
                type: "boolean"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Workspace"
        400:
          $ref: "#/components/responses/Problem400"
        401:
          $ref: "#/components/responses/Problem401"
        403:
          $ref: "#/components/responses/Problem403"
        404:
          $ref: "#/components/responses/Problem404"
        429:
          $ref: "#/components/responses/Problem429"
        500:
          $ref: "#/components/responses/Problem500"
        503:
          $ref: "#/components/responses/Problem503"
