        503:
          $ref: "#/components/responses/Problem503"
      parameters:
        -
          $ref: "#/components/parameters/Limit"
        -
          $ref: "#/components/parameters/StartingAfter"
        -
          name: "status"
          in: "query"
          required: false
          description: "Filter by current lifecycle status."
          schema:
            type: "string"
            enum:
              - "draft"
              - "sent"
              - "completed"
              - "declined"
              - "voided"
              - "expired"
    post:
      operationId: "createEnvelope"
      tags:
        - "Envelopes"
      summary: "Create draft envelope"
      description: "Required scope: envelopes:write. Expiry defaults to 30 days from creation. Mode derives from the key."
