  parameters:
    Limit:
      name: "limit"
      in: "query"
      required: false
      description: "Maximum returned items."
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    StartingAfter:
      name: "starting_after"
      in: "query"
      required: false
      description: "Last resource ID from the preceding page; must match workspace, mode, parent and filters."
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "Optional on all mutations. Workspace/mode/key-scoped 24-hour replay; differing request or in-flight request returns 409. API-key creation is an exception: duplicate returns 409 one-time-result-unavailable with existing key ID, never a second secret. Replays retain original expiry for secret URLs."
      schema:
        type: "string"
