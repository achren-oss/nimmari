webhooks:
  envelopeEvent:
    post:
      operationId: "receiveEnvelopeEvent"
      tags:
        - "Webhooks"
      summary: "Receive an envelope or recipient event"
      description: "Outbound at-least-once HTTPS delivery. Verify HMAC-SHA256 hex over timestamp + dot + exact raw body, compare constant-time, reject timestamp outside ±300 seconds and deduplicate event ID. No ordering guarantee. Initial attempt plus seven exponential retries with jitter (30s, 2m, 10m, 30m, 2h, 8h, 24h); 10s timeout. All non-2xx/network failures retry; 410 disables endpoint. Manual redelivery retains event ID and payload with a fresh delivery ID."
      security: []
      parameters:
        -
          name: "Puumerkki-Signature"
          in: "header"
          required: true
          description: "HMAC with endpoint secret: t=unix seconds,v1=lowercase hex signature. Required authentication; not a bearer API key."
          schema:
            type: "string"
            pattern: "^t=[0-9]+,v1=[a-f0-9]{64}$"
        -
          name: "Puumerkki-Event-Id"
          in: "header"
          required: true
          description: "Stable event ID for deduplication."
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
        -
          name: "Puumerkki-Delivery-Id"
          in: "header"
          required: true
          description: "Delivery ID; retries share this ID, manual redelivery creates a new ID."
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        200:
          description: "Receiver durably accepted event."
        400:
          description: "Receiver rejected malformed payload; retried."
        401:
          description: "Receiver rejected invalid signature/timestamp; retried."
        410:
          description: "Receiver permanently unavailable; endpoint disabled."
        429:
          description: "Receiver rate limited; bounded Retry-After respected."
          headers:
            Retry-After:
              description: "Retry delay in seconds."
              schema:
                type: "integer"
                minimum: 1
        500:
          description: "Receiver failed; retried."
components:
  securitySchemes:
    bearerApiKey:
      type: "http"
      scheme: "bearer"
      bearerFormat: "pk_live_<id>.<secret> or pk_test_<id>.<secret>"
      description: "Workspace-scoped API key. Persistent secret is SHA-256/Argon2id hashed; visible prefix contains ID. Required scopes are documented on operations. Test keys isolate test data and suppress real email."
  schemas:
    Workspace:
      type: "object"
      properties:
        id:
          type: "string"
          minLength: 1
          maxLength: 128
        name:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "name"
        - "created_at"
        - "updated_at"
    EnvelopeCreate:
      type: "object"
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        metadata:
          type: "object"
          additionalProperties:
            type: "string"
            maxLength: 1000
          maxProperties: 20
        routing:
          type: "string"
          enum:
            - "parallel"
            - "sequential"
          default: "parallel"
        expires_at:
          type: "string"
          format: "date-time"
      required:
        - "title"
    EnvelopeUpdate:
      type: "object"
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        metadata:
          type: "object"
          additionalProperties:
            type: "string"
            maxLength: 1000
          maxProperties: 20
        routing:
          type: "string"
          enum:
            - "parallel"
            - "sequential"
          default: "parallel"
        expires_at:
          type: "string"
          format: "date-time"
      description: "Only drafts may be changed. Provided attributes replace their existing values; metadata is replaced as a whole."
    Envelope:
      type: "object"
      properties:
        id:
          type: "string"
          minLength: 1
          maxLength: 128
        workspace_id:
          type: "string"
          minLength: 1
          maxLength: 128
        mode:
          type: "string"
          enum:
            - "live"
            - "test"
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        metadata:
          type: "object"
          additionalProperties:
            type: "string"
            maxLength: 1000
          maxProperties: 20
        routing:
          type: "string"
          enum:
            - "parallel"
            - "sequential"
          default: "parallel"
        expires_at:
          type: "string"
          format: "date-time"
        status:
          type: "string"
