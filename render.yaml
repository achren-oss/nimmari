# Prebuilt public image; no fork, build, or registry credentials required.
# Blueprints auto-sync pushes to render.yaml on the linked branch by default:
# https://render.com/docs/infrastructure-as-code
# Changing this image tag updates deployed instances.
# sync:false values are prompted only at initial creation.
services:
  - type: web
    name: nimmari
    runtime: image
    image:
      url: ghcr.io/achren-oss/nimmari:1.4.0
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: NIMMARI_SETUP_CODE
        sync: false
